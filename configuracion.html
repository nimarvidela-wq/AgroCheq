        <main class="contenido-principal">
            <header>
                <div>
                    <h2>Configuración</h2>
                    <p style="color: #64748b; margin-top: 5px;">Personalizá la cuenta y las preferencias de AgroCheq</p>
                </div>
            </header>

            <section class="formulario-caja">
                <h3 style="border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem;">Perfil y empresa</h3>
                
                <form action="#" method="POST" class="form-grid">
                    <div class="grupo-input">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" value="Mariano" required>
                    </div>
                    
                    <div class="grupo-input">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" value="Gómez" required>
                    </div>

                    <div class="grupo-input completo">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" value="mariano@agrocheq.com.ar" required>
                    </div>

                    <div class="grupo-input">
                        <label for="razon_social">Razón Social</label>
                        <input type="text" id="razon_social" value="Estancia La Verde S.A.">
                    </div>

                    <div class="grupo-input">
                        <label for="cuit">CUIT</label>
                        <input type="text" id="cuit" value="30-71652398-4">
                    </div>

                    <div class="grupo-input completo" style="align-items: flex-end;">
                        <button type="submit" class="btn-primario">💾 Guardar cambios</button>
                    </div>
                </form>
            </section>
        </main>
